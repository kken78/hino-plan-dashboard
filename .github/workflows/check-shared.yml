name: check-shared
# 共通の部品（見出し・分野のナビ・ページの一覧・フッター）が hino-portal の shared/ の正本と同じかを確かめる（DESIGN.md ADR-1）。
# あわせて、文字の大きさ（静的検査と、幅 360px と 1024px での実寸）と横のはみ出しを確かめる（DESIGN.md ADR-3）。
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 文字の大きさは hino-portal DESIGN.md 5.2（DESIGN.md ADR-3）
      - name: 共通の部品と文字の大きさ・表記と太さ（hino-portal の shared/check.py）
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --fonts --hyoki index.html

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 実ブラウザでの文字の大きさと横のはみ出し（hino-portal の shared/check_mobile.mjs）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node /tmp/hino-portal/shared/check_mobile.mjs index.html
